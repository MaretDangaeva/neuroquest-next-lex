name: Publish NeuroQuest NEXT on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate embedded images and HTML
        run: |
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path('index.html').read_text(encoding='utf-8')
          assert s.count('data:image/') >= 8, 'Expected embedded images'
          assert '<html' in s.lower() and '</html>' in s.lower()
          print('HTML and embedded image references are present')
          PY
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
