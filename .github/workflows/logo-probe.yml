name: Temporary check of the official Tetrika logo
on:
  push:
    paths:
      - '.github/workflows/logo-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect official SVG asset
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, base64, os
          ua={'User-Agent':'Mozilla/5.0'}
          urls = [
             'https://tetrika-school.ru/static/new_markup/img/new_logo.svg',
             'https://www.tetrika-school.ru/static/new_markup/img/new_logo.svg'
          ]
          for url in urls:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=20) as res:
                data=res.read(1000000)
                print('SOURCE:',res.url,'STATUS:',res.status,'LENGTH:',len(data),'TYPE:',res.headers.get('Content-Type'))
                if re.search(rb'<svg\b',data[:3000],re.I):
                  print('LOGO_DATA_START')
                  print(base64.b64encode(data).decode())
                  print('LOGO_DATA_END')
                  break
                else:
                  print('NOT_AN_SVG',repr(data[:80]))
            except Exception as e:
              print('DOWNLOAD_ERROR',url,type(e).__name__,str(e)[:150])
          else:
            print('LOGO_NOT_AVAILABLE')
          PY
